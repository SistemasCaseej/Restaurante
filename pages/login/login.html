<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
        html{
            height:100% ;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: whitesmoke;
        }
        div{
            background-color: white;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 25px;
            border-radius: 10px;
            color: black;
        }
        input{
            outline: none;
            font-size: 15px;
            padding: 5px;
        }
        button{
            background-color: rgb(3, 0, 163);
            border: none;
            width: 100%;
            padding: 15px;
            color: white;
            border-radius: 10px;
            font-size: 15px;
        }
        button:hover{
            background-color: rgb(30, 26, 245);
            cursor: pointer;
        }
        h1{
            text-align: center;
        }
        h2{
            font-size: small;
        }
    </style>
</head>
<body>
    <div class="Cadastro"> 
        <h1>Cadastro</h1>
        <h2>Nome</h2>
        <input type="text" placeholder="Digite seu nome:">
        <h2>E-mail</h2>
        <input type="text" placeholder="Digite seu e-mail:">
        <h2>Senha</h2>
        <input type="password" placeholder="Digite sua senha:">
        <br><br>
        <button>Enviar</button>
    </div>
</body>
</html>
